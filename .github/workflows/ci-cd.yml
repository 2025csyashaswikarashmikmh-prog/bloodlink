name: RaktaSetu CI/CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------- 1. CI: lint + unit tests
  backend-test:
    name: Backend - lint & tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements*.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt ruff
      - name: Lint (ruff)
        run: ruff check app --select E,F,W --ignore E501
      - name: Unit + API tests (pytest)
        run: pytest -q --junitxml=test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: backend-test-results, path: backend/test-results.xml }

  ml-test:
    name: ML service - train & tests
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: ml-service } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: ml-service/requirements*.txt }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Train models
        run: python -m app.train
      - name: Model quality gate
        run: |
          python - <<'EOF'
          import json
          m = json.load(open("models/metrics.json"))
          print(json.dumps(m, indent=2))
          assert m["acceptance"]["roc_auc"] >= 0.65, "acceptance model AUC below gate"
          assert m["no_show"]["roc_auc"] >= 0.60, "no-show model AUC below gate"
          EOF
      - run: pytest -q
      - uses: actions/upload-artifact@v4
        with: { name: ml-metrics, path: ml-service/models/metrics.json }

  frontend-check:
    name: Frontend - syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: |
          for f in frontend/*.js; do node --check "$f"; done
          grep -q 'id="main"' frontend/index.html

  # ---------------------------------------------------------------- 2. Build images + integration test
  docker-integration:
    name: Docker build & compose smoke test
    runs-on: ubuntu-latest
    needs: [backend-test, ml-test, frontend-check]
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: docker compose build
      - name: Start full stack (5 containers)
        run: docker compose up -d
      - name: Show containers and images
        run: |
          docker compose ps
          docker images | grep -E "raktasetu|postgres|redis"
      - name: End-to-end smoke test
        run: BASE=http://localhost:8080 ./scripts/smoke_test.sh
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color
      - name: Tear down
        if: always()
        run: docker compose down -v

  # ---------------------------------------------------------------- 3. CD: publish images
  publish:
    name: Push images to GHCR
    runs-on: ubuntu-latest
    needs: docker-integration
    if: github.event_name != 'pull_request'
    permissions: { contents: read, packages: write }
    strategy:
      matrix:
        service: [backend, frontend, ml]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: ctx
        run: |
          case "${{ matrix.service }}" in
            ml) echo "dir=ml-service" >> "$GITHUB_OUTPUT" ;;
            *)  echo "dir=${{ matrix.service }}" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "image=$(echo '${{ env.IMAGE_PREFIX }}' | tr '[:upper:]' '[:lower:]')/raktasetu-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.ctx.outputs.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ steps.ctx.outputs.dir }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------------------------------------------------------------- 4. CD: deploy
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: publish
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to server over SSH (if configured)
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          if [ -z "$DEPLOY_HOST" ]; then
            echo "::notice::DEPLOY_HOST not set - skipping SSH deploy. Images are published to GHCR."
            exit 0
          fi
          mkdir -p ~/.ssh && echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts
          scp docker-compose.yml "$DEPLOY_USER@$DEPLOY_HOST:~/raktasetu/docker-compose.yml"
          REG=$(echo '${{ env.IMAGE_PREFIX }}' | tr '[:upper:]' '[:lower:]')
          ssh "$DEPLOY_USER@$DEPLOY_HOST" "cd ~/raktasetu && export REGISTRY=$REG TAG=latest && docker compose pull && docker compose up -d --no-build && docker image prune -f"
      - name: Trigger Render deploy hook (if configured)
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then curl -fsS -X POST "$RENDER_DEPLOY_HOOK"; else echo "Render hook not set - skipping"; fi
      - name: Deployment summary
        run: |
          echo "## RaktaSetu deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA::7}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Images: ghcr.io/${{ github.repository_owner }}/raktasetu-{backend,frontend,ml}:latest" >> "$GITHUB_STEP_SUMMARY"
